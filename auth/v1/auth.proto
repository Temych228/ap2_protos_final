syntax = "proto3";

package auth.v1;

option go_package = "github.com/Temych228/AP2_Final_OnlineParking/services/auth-service/gen/auth/v1;authv1";

import "google/protobuf/timestamp.proto";

service AuthService {
  // Register a new user
  rpc Register(RegisterRequest) returns (RegisterResponse);
  // Login with email + password
  rpc Login(LoginRequest) returns (LoginResponse);
  // Refresh access token using refresh token
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  // Logout (invalidate refresh token)
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  // Validate access token (called by API Gateway / other services)
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  // Verify email via token sent to email
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  // Request password reset
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse);
  // Reset password using token
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);
  // Change password (authenticated)
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // Get current session info
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  // Revoke all sessions for user (admin / security)
  rpc RevokeAllSessions(RevokeAllSessionsRequest) returns (RevokeAllSessionsResponse);
}

message RegisterRequest {
  string email      = 1;
  string password   = 2;
  string first_name = 3;
  string last_name  = 4;
  string phone      = 5;
}

message RegisterResponse {
  string user_id    = 1;
  string message    = 2; // "Verification email sent"
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string access_token        = 1;
  string refresh_token       = 2;
  google.protobuf.Timestamp expires_at = 3;
  string user_id             = 4;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool   valid   = 1;
  string user_id = 2;
  string email   = 3;
  string role    = 4;
}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  bool   success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  bool   success = 1;
  string message = 2;
}

message ResetPasswordRequest {
  string token        = 1;
  string new_password = 2;
}

message ResetPasswordResponse {
  bool success = 1;
}

message ChangePasswordRequest {
  string user_id      = 1;
  string old_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
}

message GetSessionRequest {
  string access_token = 1;
}

message GetSessionResponse {
  string user_id    = 1;
  string email      = 2;
  string role       = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message RevokeAllSessionsRequest {
  string user_id = 1;
}

message RevokeAllSessionsResponse {
  int32 revoked_count = 1;
}
