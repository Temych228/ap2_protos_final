syntax = "proto3";

package user.v1;

option go_package = "github.com/Temych228/AP2_Final_OnlineParking/services/user-service/gen/user/v1;userv1";

import "google/protobuf/timestamp.proto";

service UserService {
  // Get user profile by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Get user by email (used by auth-service)
  rpc GetUserByEmail(GetUserByEmailRequest) returns (GetUserResponse);
  // Update user profile
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  // Delete user account
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  // List users (admin)
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  // Create user profile (called by auth-service after registration)
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Get user by ID (batch)
  rpc GetUsersBatch(GetUsersBatchRequest) returns (GetUsersBatchResponse);
  // Check if user exists
  rpc CheckUserExists(CheckUserExistsRequest) returns (CheckUserExistsResponse);
  // Update user email verification status
  rpc VerifyUserEmail(VerifyUserEmailRequest) returns (VerifyUserEmailResponse);
  // Stream user profile changes (server-side streaming)
  rpc WatchUser(WatchUserRequest) returns (stream UserEvent);
  // Get user stats
  rpc GetUserStats(GetUserStatsRequest) returns (GetUserStatsResponse);
  // Soft ban user (admin)
  rpc BanUser(BanUserRequest) returns (BanUserResponse);
}

message User {
  string id          = 1;
  string email       = 2;
  string first_name  = 3;
  string last_name   = 4;
  string phone       = 5;
  string role        = 6; // "user" | "admin"
  bool   is_verified = 7;
  bool   is_banned   = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserByEmailRequest {
  string email = 1;
}

message GetUserResponse {
  User user = 1;
}

message CreateUserRequest {
  string email      = 1;
  string first_name = 2;
  string last_name  = 3;
  string phone      = 4;
  string role       = 5;
}

message CreateUserResponse {
  User user = 1;
}

message UpdateUserRequest {
  string user_id    = 1;
  string first_name = 2;
  string last_name  = 3;
  string phone      = 4;
}

message UpdateUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string user_id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message ListUsersRequest {
  int32  page      = 1;
  int32  page_size = 2;
  string role      = 3; // optional filter
}

message ListUsersResponse {
  repeated User users = 1;
  int32         total = 2;
}

message GetUsersBatchRequest {
  repeated string user_ids = 1;
}

message GetUsersBatchResponse {
  repeated User users = 1;
}

message CheckUserExistsRequest {
  string email = 1;
}

message CheckUserExistsResponse {
  bool   exists  = 1;
  string user_id = 2;
}

message VerifyUserEmailRequest {
  string user_id = 1;
}

message VerifyUserEmailResponse {
  bool success = 1;
}

message WatchUserRequest {
  string user_id = 1;
}

message UserEvent {
  string event_type = 1; // "updated" | "deleted" | "banned"
  User   user       = 2;
}

message GetUserStatsRequest {
  string user_id = 1;
}

message GetUserStatsResponse {
  int32 total_bookings   = 1;
  int32 active_bookings  = 2;
  float total_spent      = 3;
}

message BanUserRequest {
  string user_id = 1;
  string reason  = 2;
}

message BanUserResponse {
  bool success = 1;
}
