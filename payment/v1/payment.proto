syntax = "proto3";

package payment.v1;

option go_package = "github.com/Temych228/ap2_protos_go_final/payment/v1;paymentv1";

import "google/protobuf/timestamp.proto";

service PaymentService {
  rpc CreatePayment(CreatePaymentRequest) returns (PaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
  rpc GetPaymentByBooking(GetPaymentByBookingRequest) returns (PaymentResponse);
  rpc ListPayments(ListPaymentsRequest) returns (PaymentListResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (PaymentResponse);
  rpc Health(HealthRequest) returns (HealthResponse);

  rpc MarkPaymentPaid(MarkPaymentPaidRequest) returns (PaymentResponse);
  rpc MarkPaymentFailed(MarkPaymentFailedRequest) returns (PaymentResponse);
  rpc CheckBookingPaid(CheckBookingPaidRequest) returns (CheckBookingPaidResponse);
  rpc ListPaymentsByParking(ListPaymentsByParkingRequest) returns (PaymentListResponse);
  rpc GetPaymentStats(GetPaymentStatsRequest) returns (PaymentStatsResponse);
  rpc GetRevenueByParking(GetRevenueByParkingRequest) returns (RevenueByParkingResponse);
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  PAYMENT_METHOD_CARD = 1;
  PAYMENT_METHOD_CASH = 2;
  PAYMENT_METHOD_KASPI = 3;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_STATUS_PENDING = 1;
  PAYMENT_STATUS_PAID = 2;
  PAYMENT_STATUS_FAILED = 3;
  PAYMENT_STATUS_CANCELLED = 4;
}

message Payment {
  string id = 1;
  string booking_id = 2;
  string user_id = 3;

  int64 parking_id = 4;
  int64 spot_id = 5;

  double amount = 6;

  PaymentMethod method = 7;
  PaymentStatus status = 8;

  string provider_payment_id = 9;
  string failure_reason = 10;

  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp paid_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreatePaymentRequest {
  string booking_id = 1;
  PaymentMethod method = 2;
}

message GetPaymentRequest {
  string id = 1;
}

message GetPaymentByBookingRequest {
  string booking_id = 1;
}

message ListPaymentsRequest {
  string user_id = 1;
  PaymentStatus status = 2;
}

message PaymentResponse {
  Payment payment = 1;
}

message PaymentListResponse {
  repeated Payment payments = 1;
}

message CancelPaymentRequest {
  string id = 1;
}

message MarkPaymentPaidRequest {
  string id = 1;
  string provider_payment_id = 2;
}

message MarkPaymentFailedRequest {
  string id = 1;
  string failure_reason = 2;
}

message CheckBookingPaidRequest {
  string booking_id = 1;
}

message CheckBookingPaidResponse {
  string booking_id = 1;
  bool paid = 2;
}

message ListPaymentsByParkingRequest {
  int64 parking_id = 1;
}

message GetPaymentStatsRequest {}

message PaymentStatsResponse {
  int64 total_payments = 1;
  int64 pending_payments = 2;
  int64 paid_payments = 3;
  int64 failed_payments = 4;
  int64 cancelled_payments = 5;
  double total_revenue = 6;
}

message GetRevenueByParkingRequest {
  int64 parking_id = 1;
}

message RevenueByParkingResponse {
  int64 parking_id = 1;
  int64 paid_payments = 2;
  double total_revenue = 3;
}

message HealthRequest {}

message HealthResponse {
  string service = 1;
  string status = 2;
}